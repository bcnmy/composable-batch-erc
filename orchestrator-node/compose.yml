services:
  # Local PropAMM chain: anvil preloaded with a state dump where every contract is ALREADY
  # deployed (see local/addresses.env). Nothing to deploy, nothing to fund — `docker compose up
  # anvil` and point your node at http://localhost:8545. Rebuild the dump with
  # local/build-local-state.sh only when the contracts change.
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - "--host=0.0.0.0"
      - "--port=8545"
      - "--chain-id=31337"
      - "--load-state=/state/anvil-state.json"
    ports:
      - "8545:8545"
    volumes:
      - ./local:/state:ro
    restart: unless-stopped

  orchestrator-node:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    env_file:
      - path: .env
        required: false
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TOKEN_SLOT_DETECTION_SERVER_BASE_URL=http://token-storage-detection:5000
    depends_on:
      redis:
        condition: service_started
      token-storage-detection:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  token-storage-detection:
    build:
      context: ./apps/token-storage-detection
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - path: ./apps/token-storage-detection/.env
        required: false
    restart: unless-stopped

volumes:
  redis-data:
